<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
    <!-- External CSS file link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>ADMISSION FORM FOR WEB DEVELOPMENT AND E-COMMERCE</h2>
            
     <div class="form">
    <label for="name">NAME</label>
 <input type="text" id="name" name="name" placeholder="Enter your name">
            </div>

<div class="form">
<label for="dob">DATE OF BIRTH</label>
<input type="date" id="dob" name="dob">
 </div>

 <div class="form">
<label for="file">UPLOAD FILE</label>
<input type="file" id="file" name="file">
</div>

<div class="form">
<label for="password">PASSWORD</label>
<input type="password" id="password" name="password" placeholder="Enter your password">
 </div>

 <div class="form">
<label for="phone">TELEPHONE</label>
<input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
</div>

<div class="form">
<label for="email">GMAIL</label>
 <input type="email" id="email" name="email" placeholder="Enter your email">
</div>

 <div class="form">
<label for="address">ADDRESS</label>
<input type="text" id="address" name="address" placeholder="Enter your address">
</div>

<div class="form">
<label>GENDER</label>
<div class="gender">
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
 </div>
 <div class="gender">
 <input type="radio" id="female" name="gender" value="female">
 <label for="female">Female</label>
 </div>
 </div>

<div class="form">
 <label>INTERESTED IN</label>
<div class="inline-option">
<input type="checkbox" id="course-web" name="course" value="web_development">
<label for="course-web">Web Development</label>
</div>

<div class="checkbox">
<input type="checkbox" id="course-ecommerce" name="course" value="e_commerce">
<label for="course-ecommerce">E-Commerce</label>
  </div>
   </div>

<div class="buttons">
    <input type="reset" value="Reset" class="btn btn-reset">
    <input type="submit" value="Submit" class="btn btn-submit">
 </div>

        </form>
    </div>

</body>
</html>
